<script type="text/html" data-help-name="ccu-homeassistant">
    <p>Veröffentlicht Home-Assistant-MQTT-Discovery-Konfigurationen für ausgewählte Geräte.</p>
    <p>Der Node ist ein Begleiter zum <b>ccu-mqtt</b>-Node: er übernimmt dessen Topic-Vorlagen und
    Payload-Format, so dass die Discovery-Konfigurationen auf die Topics zeigen, die ccu-mqtt bereits
    veröffentlicht bzw. entgegennimmt. Status und Befehle laufen weiterhin über ccu-mqtt.</p>
    <h3>Verkabelung</h3>
    <p>Den Ausgang mit demselben <b>mqtt out</b>-Node verbinden wie den ccu-mqtt-Node. Der Node sendet
    <code>msg.topic</code>, <code>msg.payload</code> und <code>msg.retain</code>.</p>
    <h3>Geräteauswahl</h3>
    <p>Nur angehakte Geräte werden an Home Assistant gemeldet. Wird ein zuvor angehaktes Gerät abgehakt, sendet der Node beim nächsten Deploy eine leere
    Konfiguration, die das Gerät in Home Assistant entfernt.</p>
    <h3>Kanäle als Geräte</h3>
    <p>Die Option <i>Channels</i> legt fest, wie Home Assistant ein Homematic-Gerät mit mehreren Kanälen sieht:</p>
    <ul>
        <li><b>one device</b> (Standard): ein Home-Assistant-Gerät pro Homematic-Gerät, wie bisher;</li>
        <li><b>child devices</b>: jeder Kanal wird ein Untergerät (Child Device) des Geräts (Home Assistant 2026.11
        oder neuer). Die Entitäten ziehen an Ort und Stelle um: IDs, Verlauf und Einstellungen bleiben, und der
        Weg zurück geht jederzeit. Ein Untergerät liegt im Bereich seines Geräts, bis man ihm in Home Assistant
        einen anderen gibt (für MQTT-Untergeräte nimmt Home Assistant keinen Bereichsvorschlag an). Ein älteres
        Home Assistant lehnt die ganze Gerätekonfiguration ab („not a valid option at 'cdevs'“ im Log);</li>
        <li><b>own devices</b>: jeder Kanal wird ein eigenes Gerät, im Raum seines Kanals, mit dem Homematic-Gerät
        verknüpft. Der Wechsel dorthin oder zurück entfernt die Entitäten und legt sie am neuen Gerät neu an: Home
        Assistant stellt ihre Entitäts-IDs und Bereiche meist wieder her, die Einstellungen der Geräte selbst
        aber nicht, und Automationen, die ein Gerät über seine Geräte-ID ansprechen, müssen angepasst werden.</li>
    </ul>
    <p>Ein Kanal ist hier eine Funktion: der Kanal eines HmIP-Schalt-, Dimm- oder Rollladenaktors zählt mit seinen
    drei virtuellen Kanälen als einer, eine Taste oder ein Eingang als einer. Der Wartungskanal (<code>:0</code>:
    Erreichbarkeit, Batterie, Signal) bleibt immer am Gerät, und ein Gerät mit nur einer Funktion (ein
    Zwischenstecker, ein Kontakt) wird nicht aufgeteilt. Die Hauptentität eines Kanals trägt den Namen ihres
    Geräts, die übrigen den ihres Datenpunkts.</p>
    <p>In der Gerätetabelle öffnet der Pfeil die Kanäle eines Geräts. Pro Gerät übersteuert eine Einstellung die
    Option des Nodes; pro Kanal schaltet <i>publish</i> ihn für Home Assistant ab (seine MQTT-Topics bleiben), und
    die Auswahl legt ihn ans Gerät, in ein Untergerät oder in ein eigenes Gerät, egal was Gerät und Node sagen. Ein
    unveränderter Kanal folgt seinem Gerät, das Gerät dem Node. Die Sammelaktion unter dem Filter gilt für jedes
    aufgelistete, angehakte Gerät oder für dessen Kanäle, auf die der Filter passt (z. B. alle Kanäle im Raum
    „Küche“: eigenes Gerät); gespeichert werden die einzelnen Werte.</p>
    <p>Ein Kanal, der nicht mehr veröffentlicht wird oder in ein anderes Gerät wandert, wird beim nächsten Deploy
    aus Home Assistant entfernt. Was er veröffentlicht hat, merkt sich der Node in
    <code>ccu_homeassistant_&lt;Node-ID&gt;.json</code> im Benutzerverzeichnis von Node-RED.</p>
    <h3>Entitäten</h3>
    <p>Schalter, Dimmer (light), Rollladen/Jalousie (cover), Thermostate (climate), Kontakte/Bewegung/
    Rauch/Wasser (binary_sensor), Tasten (event), KeyMatic (lock), Energie/Wetter (sensor). Mit der
    Option <i>weitere Datenpunkte</i> werden alle übrigen Datenpunkte als standardmäßig deaktivierte
    Entitäten mitgeliefert.</p>
    <h3>Eingang</h3>
    <p>Jede eingehende Nachricht veröffentlicht die Discovery-Konfigurationen und die Verfügbarkeit
    erneut. Wer einen <b>mqtt in</b>-Node auf <code>homeassistant/status</code> (bzw.
    <code>&lt;Präfix&gt;/status</code>) anschließt, bekommt beides nach jedem Neustart von Home Assistant
    neu; dessen <code>offline</code> auf diesem Topic wird ignoriert.</p>
    <h3>Voraussetzungen</h3>
    <p>Home Assistant ≥ 2024.11 (gerätebasierte Discovery); für Kanäle als Untergeräte Home Assistant
    ≥ 2026.11.</p>
    <h3>Verfügbarkeit</h3>
    <p>Die Verfügbarkeit der Geräte wird aus dem UNREACH-Datenpunkt des Wartungskanals abgeleitet
    (<code>…:0/UNREACH</code>). Home Assistant zeigt alle Entitäten eines Geräts als „nicht verfügbar“,
    bis auf diesem Topic ein Wert ankommt. Deshalb veröffentlicht der Node direkt nach den
    Discovery-Konfigurationen den aktuellen UNREACH-Wert jedes Geräts (retained), fragt ihn dazu bei der
    CCU ab und sendet jede Änderung. Ein Gerät, das nie unerreichbar war, ist so trotzdem verfügbar.</p>
    <h3>Raum und Bereich</h3>
    <p>Home Assistant ordnet Geräte Bereichen zu, die CCU Kanäle Räumen. Der Node schlägt Home Assistant den
    Raum der Kanäle als Bereich des Geräts vor (<code>suggested_area</code>): den Raum, den alle Kanäle des
    Geräts teilen, die in einem Raum liegen, sonst den Raum des Kanals mit der niedrigsten Nummer, der in
    einem liegt. Liegt ein Kanal in mehreren Räumen, zählt der erste; auf openccu-lite, wo Räume verschachtelt
    sein können, der speziellste (das Zimmer vor dem Stockwerk), und ein Raum des Geräts selbst geht vor. Die
    Räume kommen auf einer CCU aus der ReGaHSS, auf openccu-lite aus den Metadaten des Systems.</p>
    <p>Home Assistant übernimmt den Vorschlag nur, wenn es das Gerät neu anlegt. Ein später auf der CCU
    geänderter Raum bleibt in Home Assistant, wie er dort zugeordnet ist: dort ändern, oder das Gerät in Home
    Assistant löschen und die Discovery erneut veröffentlichen. Die Option <i>Raum als Bereich vorschlagen</i>
    schaltet den Vorschlag ab.</p>
</script>
