<script type="text/html" data-help-name="ccu-sysvar">
    <p>Setzen und lesen von ReGaHSS Systemvariablen.</p>
    <p><b>openccu-lite:</b> das System hat keine ReGaHSS; die Systemvariablen kommen vom Addon <i>Logic</i>, das sie
    als Geräte seiner Schnittstelle <code>Logic</code> über die lite-rpc des Systems anbietet. Der Node findet eine
    Variable wie auf der CCU über ihren Namen und bekommt bei jedem Schreiben ein Ereignis (<i>Nur geänderte Werte ausgeben</i>
    lässt das Schreiben desselben Werts weg). Die Verbindung braucht lite-rpc (ein Token mit <code>rpc:read</code>
    und <code>rpc:operate</code>, oder RedMatic auf dem System selbst); ohne das Addon zeigt der Node
    <i>Logic addon not installed</i>. <code>msg.iface</code> ist <code>Logic</code>, <code>msg.key</code> der
    Schlüssel der Variablen und <code>msg.address</code> ihr Kanal (<code>var-&lt;key&gt;:1</code>).</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload
            <span class="property-type">*</span>
        </dt>
        <dd>
            Der Wert der der Systemvariablen zugewiesen werden soll.
        </dd>
    </dl>
    <h3>Outputs</h3>
     <ol class="node-ports">
         <li>Output

               <code>msg</code> Beispiel:<br>
               <pre><code>
{
	"ccu": "localhost",
	"iface": "ReGaHSS",
	"type": "SYSVAR",
	"name": "Anwesenheit",
	"payload": false,
	"value": false,
	"valueType": "boolean",
	"valueEnum": "nicht anwesend",
	"ts": 1525197999611,
	"lc": 1525197999611,
	"enum": ["nicht anwesend", "anwesend"],
	"id": 950,
	"topic": "hm/status/sysvar/Anwesenheit"
}
               </code></pre>
         </li>
     </ol>

    <h3>Topic</h3>
    <p><code>msg.topic</code> wird aus dem Feld <i>Topic</i> gebildet; <code>${Name}</code> steht für den Namen der Variable.
    Ein neu platzierter Node hat <code>hm/status/sysvar/${Name}</code>; ein schon vorhandener Node behält sein Topic
    (<code>ReGaHSS/${Name}</code> bis 4.16.0).</p>

    <h3>Dynamische Konfiguration</h3>
    <p><code>msg.config</code> ist ein Objekt, dessen Eigenschaften die Konfiguration dieses Nodes für genau diese Nachricht überschreiben. Die gespeicherte Konfiguration bleibt unverändert.</p>
    <ul>
        <li><code>name</code></li>
    </ul>
    <p>Woher der zu schreibende Wert kommt, stellt das Feld <em>Wert aus</em> ein (msg/flow/global/env) — er muss nicht mehr in <code>msg.payload</code> stehen.</p>
</script>
