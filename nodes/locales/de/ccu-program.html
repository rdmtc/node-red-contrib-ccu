<script type="text/html" data-help-name="ccu-program">
    <p>Führt ein ReGaHSS Programm aus.</p>
    <p><b>openccu-lite:</b> die Programme kommen vom Addon <i>Logic</i> über die lite-rpc des Systems (Schnittstelle
    <code>Logic</code>). Ein boolean schaltet <code>ACTIVE</code> des Programms; alles andere startet es wie auf der
    CCU - das erste <i>Dann</i>, ohne die Bedingungen zu prüfen (<code>RUN_THEN</code>). Der Ausgang folgt
    <code>ACTIVE</code> und jedem Lauf des Programms. Ohne das Addon zeigt der Node <i>Logic addon not
    installed</i>.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload
            <span class="property-type">*</span>
        </dt>
        <dd>
            Ist der Payload vom Typ boolean wird das Programm bei <code>true</code> aktiviert und ausgeführt und bei
            <code>false</code> deaktiviert. In allen anderen Fällen (Payload ist z.B. ein leerer String) wird das
            Programm ausgeführt.
        </dd>
    </dl>
    <h3>Outputs</h3>
     <ol class="node-ports">
         <li>Output
             <dl class="message-properties">
                 <dt>payload <span class="property-type">string</span></dt>
                 <dd>
                   Im Payload ist der Zeitstempel der letzten Programmausführung (Attribut <code>ts</code>) sowie
                   die Information ob ein Programm aktiv oder inaktiv ist (Attribut <code>active</code>) enthalten.
                 </dd>
             </dl>
         </li>
     </ol>
</script>
