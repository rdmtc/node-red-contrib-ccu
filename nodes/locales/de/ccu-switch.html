<script type="text/html" data-help-name="ccu-switch">
    <p>Nachricht abhängig von einem Zustand eines Aktors oder einer Systemvariablen weiterleiten.</p>
    <h3>Details</h3>
    <p>Der ccu switch Node verhält sich ähnlich wie der switch Node von Node-RED. Er leitet eine Nachricht abhängig von einem Zustand eines Aktors oder einer Systemvariablen weiter, wahlweise auch je nach Zustand an unterschiedliche Ausgänge.</p>
    <h4>Dokumentation</h4>
    <a target="_blank" href="https://github.com/rdmtc/RedMatic/wiki/CCU-Nodes#ccu-switch-node">ccu switch node im RedMatic Wiki</a>

    <h3>Dynamische Konfiguration</h3>
    <p><code>msg.config</code> ist ein Objekt, dessen Eigenschaften die Konfiguration dieses Nodes für genau diese Nachricht überschreiben. Die gespeicherte Konfiguration bleibt unverändert.</p>
    <ul>
        <li><code>iface</code></li>
        <li><code>channel</code></li>
        <li><code>datapoint</code></li>
        <li><code>datapointProperty</code></li>
        <li><code>sysvar</code></li>
        <li><code>sysvarProperty</code></li>
    </ul>
</script>
