<script type="text/html" data-help-name="ccu-sysvar">
    <p>Set and read ReGaHSS system variables.</p>
    <p><b>openccu-lite:</b> the system has no ReGaHSS; the system variables come from the <i>Logic</i> addon,
    which offers them as devices of its interface <code>Logic</code> through the system's lite-rpc. The node finds a
    variable by its name, as on a CCU, and gets an event at every write (<i>Emit changed values only</i> leaves out a write of
    the same value). The connection needs lite-rpc (a token with <code>rpc:read</code> and <code>rpc:operate</code>,
    or RedMatic on the system itself); without the addon the node shows <i>Logic addon not installed</i>.
    <code>msg.iface</code> is <code>Logic</code>, <code>msg.key</code> the variable's key and
    <code>msg.address</code> its channel (<code>var-&lt;key&gt;:1</code>).</p>
        <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload
            <span class="property-type">*</span>
        </dt>
        <dd>
            The value that should be assigned to the variable.
        </dd>
    </dl>

    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Output - every change of the variable (with <i>Rega poll</i> on in the connection) and, after a write, its new state. <code>msg</code> example:<br>
            <pre><code>
{
	"ccu": "localhost",
	"iface": "ReGaHSS",
	"type": "SYSVAR",
	"name": "Presence",
	"payload": false,
	"value": false,
	"valueType": "boolean",
	"valueEnum": "absent",
	"ts": 1525197999611,
	"lc": 1525197999611,
	"enum": ["absent", "present"],
	"id": 950,
	"topic": "ReGaHSS/Presence"
}
            </code></pre>
        </li>
    </ol>

    <h3>Dynamic configuration</h3>
    <p><code>msg.config</code> is an object whose properties override this node's configuration for that one message. The stored configuration is never modified.</p>
    <ul>
        <li><code>name</code></li>
    </ul>
    <p>The <em>Value from</em> field selects where the value to write comes from (msg/flow/global/env); it no longer has to be <code>msg.payload</code>.</p>
</script>
