<script type="text/html" data-help-name="ccu-program">
    <p>Executes a ReGaHSS program.</p>
    <p><b>openccu-lite:</b> the programs come from the <i>Logic</i> addon through the system's lite-rpc (interface
    <code>Logic</code>). A boolean switches the program's <code>ACTIVE</code>; anything else starts it as on a CCU -
    the first <i>Then</i> without looking at the conditions (<code>RUN_THEN</code>). The output follows
    <code>ACTIVE</code> and every run of the program. Without the addon the node shows <i>Logic addon not
    installed</i>.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload
            <span class="property-type">*</span>
        </dt>
        <dd>
            If the payload is of type boolean the program gets (de)activated. On activation it is executed also. In all
            other cases the program will be executed.
        </dd>
    </dl>
    <h3>Outputs</h3>
     <ol class="node-ports">
         <li>Output
             <dl class="message-properties">
                 <dt>payload <span class="property-type">string</span></dt>
                 <dd>
                    The payload contains a timestamp of the last program run (property <code>ts</code> and the
                    information if the program is activated (property <code>active</code>).
                 </dd>
             </dl>
         </li>
     </ol>
</script>
