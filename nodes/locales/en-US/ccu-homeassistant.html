<script type="text/html" data-help-name="ccu-homeassistant">
    <p>Publishes Home Assistant MQTT discovery configurations for selected devices.</p>
    <p>The node is a companion to the <b>ccu-mqtt</b> node: it reuses that node's topic templates and
    payload format, so the discovery configs point at the topics ccu-mqtt already publishes and
    consumes. State and commands keep flowing through ccu-mqtt.</p>
    <h3>Wiring</h3>
    <p>Connect the output to the same <b>mqtt out</b> node as the ccu-mqtt node. The node sends
    <code>msg.topic</code>, <code>msg.payload</code> and <code>msg.retain</code>.</p>
    <h3>Device selection</h3>
    <p>Only checked devices are announced to Home Assistant. Unchecking a previously checked device publishes an empty config on the next deploy, which
    removes the device from Home Assistant.</p>
    <h3>Channels as devices</h3>
    <p>The option <i>Channels</i> decides how Home Assistant sees a Homematic device with several channels:</p>
    <ul>
        <li><b>one device</b> (the default): one Home Assistant device per Homematic device, as before;</li>
        <li><b>child devices</b>: each channel becomes a child device of the device (Home Assistant 2026.11 or
        newer). The entities move in place: their IDs, history and settings stay, and switching back is
        possible at any time. A child device is in the area of its device until you give it another one in Home
        Assistant (Home Assistant takes no suggested area for an MQTT child device). An older Home Assistant
        refuses the whole device configuration ("not a valid option at 'cdevs'" in its log);</li>
        <li><b>own devices</b>: each channel becomes a device of its own, in the room of its channel, linked to the
        Homematic device. Switching to or from it removes the entities and creates them again under the new
        device: Home Assistant usually restores their entity IDs and areas, but the settings of the devices
        themselves do not carry over, and automations that target a device by its device ID must be adjusted.</li>
    </ul>
    <p>A channel here is a function: an HmIP switch, dimmer or blind actuator's channel with its three virtual
    channels counts as one, a key or an input as one. The maintenance channel (<code>:0</code>: reachability,
    battery, signal) always stays on the device, and a device with a single function (a plug, a contact) is not
    split. The main entity of a channel takes the name of its device, the others the name of their datapoint.</p>
    <p>In the device table the arrow opens a device's channels. Per device a setting overrides the node's option;
    per channel <i>publish</i> switches it off for Home Assistant (its MQTT topics stay) and the select puts it
    on the device, into a child device or into a device of its own, whatever the device and node say. A channel
    left as it is follows its device, the device the node. The bulk action under the filter applies to every
    listed, ticked device, or to its channels that match the filter (e.g. all channels in the room "Kitchen":
    own device); the single values are stored.</p>
    <p>A channel that is no longer published, or moves to another device, is removed from Home Assistant on the
    next deploy. The node remembers what it published in <code>ccu_homeassistant_&lt;node id&gt;.json</code> in
    the Node-RED user directory.</p>
    <h3>Entities</h3>
    <p>Switches, dimmers (light), blinds/shutters (cover), thermostats (climate), contacts/motion/
    smoke/water (binary_sensor), keys (event), KeyMatic (lock), energy/weather (sensor). With the
    <i>other datapoints</i> option every remaining datapoint is included as an entity that is
    disabled by default.</p>
    <h3>Input</h3>
    <p>Any incoming message republishes the discovery configs and the availability. Wire an
    <b>mqtt in</b> node on <code>homeassistant/status</code> (or <code>&lt;prefix&gt;/status</code>) to
    the input to get both again after every Home Assistant restart; its <code>offline</code> on that
    topic is ignored.</p>
    <h3>Requirements</h3>
    <p>Home Assistant ≥ 2024.11 (device-based discovery); for channels as child devices Home Assistant
    ≥ 2026.11.</p>
    <h3>Availability</h3>
    <p>Device availability is derived from the UNREACH datapoint of the maintenance channel
    (<code>…:0/UNREACH</code>). Home Assistant shows every entity of a device as "unavailable" until
    a value arrives on that topic. So right after the discovery configs the node publishes each
    device's current UNREACH (retained), asking the CCU for it, and sends every change. A device that
    was never unreachable is available all the same.</p>
    <h3>Room and area</h3>
    <p>Home Assistant assigns devices to areas, the CCU assigns channels to rooms. The node suggests the
    channels' room as the device's area (<code>suggested_area</code>): the room shared by all channels of
    the device that lie in a room, otherwise the room of the lowest-numbered channel that lies in one. A
    channel in several rooms counts with its first; on openccu-lite, where rooms can be nested, with the most
    specific one (the room before the floor), and a room of the device itself comes first. The rooms come
    from the ReGaHSS on a CCU and from the system's metadata on openccu-lite.</p>
    <p>Home Assistant applies the suggestion only when it creates the device. A room changed later on the
    CCU stays as assigned in Home Assistant: change it there, or delete the device in Home Assistant and
    republish the discovery. The option <i>Suggest the channel's room as the device's area</i> switches the
    suggestion off.</p>
</script>
