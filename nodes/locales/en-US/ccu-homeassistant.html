<script type="text/html" data-help-name="ccu-homeassistant">
    <p>Publishes Home Assistant MQTT discovery configurations for selected devices.</p>
    <p>The node is a companion to the <b>ccu-mqtt</b> node: it reuses that node's topic templates and
    payload format, so the discovery configs point at the topics ccu-mqtt already publishes and
    consumes. State and commands keep flowing through ccu-mqtt.</p>
    <h3>Wiring</h3>
    <p>Connect the output to the same <b>mqtt out</b> node as the ccu-mqtt node. The node sends
    <code>msg.topic</code>, <code>msg.payload</code> and <code>msg.retain</code>.</p>
    <h3>Device selection</h3>
    <p>Only checked devices are announced to Home Assistant (one HA device per Homematic device).
    Unchecking a previously checked device publishes an empty config on the next deploy, which
    removes the device from Home Assistant.</p>
    <h3>Entities</h3>
    <p>Switches, dimmers (light), blinds/shutters (cover), thermostats (climate), contacts/motion/
    smoke/water (binary_sensor), keys (event), KeyMatic (lock), energy/weather (sensor). With the
    <i>other datapoints</i> option every remaining datapoint is included as an entity that is
    disabled by default.</p>
    <h3>Input</h3>
    <p>Any incoming message republishes the discovery configs and the availability. Wire an
    <b>mqtt in</b> node on <code>homeassistant/status</code> (or <code>&lt;prefix&gt;/status</code>) to
    the input to get both again after every Home Assistant restart; its <code>offline</code> on that
    topic is ignored.</p>
    <h3>Requirements</h3>
    <p>Home Assistant ≥ 2024.11 (device-based discovery).</p>
    <h3>Availability</h3>
    <p>Device availability is derived from the UNREACH datapoint of the maintenance channel
    (<code>…:0/UNREACH</code>). Home Assistant shows every entity of a device as "unavailable" until
    a value arrives on that topic. So right after the discovery configs the node publishes each
    device's current UNREACH (retained), asking the CCU for it, and sends every change. A device that
    was never unreachable is available all the same.</p>
    <h3>Room and area</h3>
    <p>Home Assistant assigns devices to areas, the CCU assigns channels to rooms. The node suggests the
    channels' room as the device's area (<code>suggested_area</code>): the room shared by all channels of
    the device that lie in a room, otherwise the room of the lowest-numbered channel that lies in one. A
    channel in several rooms counts with its first; on openccu-lite, where rooms can be nested, with the most
    specific one (the room before the floor), and a room of the device itself comes first. The rooms come
    from the ReGaHSS on a CCU and from the system's metadata on openccu-lite.</p>
    <p>Home Assistant applies the suggestion only when it creates the device. A room changed later on the
    CCU stays as assigned in Home Assistant: change it there, or delete the device in Home Assistant and
    republish the discovery. The option <i>Suggest the channel's room as the device's area</i> switches the
    suggestion off.</p>
</script>
