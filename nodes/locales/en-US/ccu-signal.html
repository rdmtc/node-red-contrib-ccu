<script type="text/html" data-help-name="ccu-signal">
    <p>Send LED- and Sound-Signals.</p>

    <h3>Dynamic configuration</h3>
    <p><code>msg.config</code> is an object whose properties override this node's configuration for that one message. The stored configuration is never modified.</p>
    <ul>
        <li><code>iface</code></li>
        <li><code>channel</code></li>
        <li><code>channelType</code></li>
        <li><code>chime</code></li>
        <li><code>led</code></li>
        <li><code>signal</code></li>
        <li><code>volume</code></li>
        <li><code>repeat</code></li>
        <li><code>repetitions</code></li>
        <li><code>durationUnit</code></li>
        <li><code>durationValue</code></li>
        <li><code>rampTimeUnit</code></li>
        <li><code>rampTimeValue</code></li>
        <li><code>acousticAlarmSelection</code></li>
        <li><code>opticalAlarmSelection</code></li>
        <li><code>dimmerLevel</code></li>
        <li><code>dimmerColor</code></li>
        <li><code>colorBehaviour</code>: how the LED of an HmIP-BSL from firmware 2.x on or of an HmIPW-WRC6 lights, as a number or a name from <code>COLOR_BEHAVIOUR</code> (<code>0</code>/<code>OFF</code>, <code>1</code>/<code>ON</code>, <code>BLINKING_SLOW</code>, <code>BLINKING_MIDDLE</code>, <code>BLINKING_FAST</code>, <code>FLASH_SLOW</code>, <code>FLASH_MIDDLE</code>, <code>FLASH_FAST</code>, <code>BILLOW_SLOW</code>, <code>BILLOW_MIDDLE</code>, <code>BILLOW_FAST</code>, <code>OLD_VALUE</code>). Not set: <code>ON</code>. It is not sent to an HmIP-BSL with firmware 1.x.</li>
        <li><code>dimmerList</code></li>
        <li><code>soundLevel</code></li>
        <li><code>soundList</code></li>
    </ul>
    <p><code>soundList</code> and <code>dimmerList</code> also accept a plain array of values, e.g. <code>msg.config.soundList = [1, 2]</code>.</p>
</script>
