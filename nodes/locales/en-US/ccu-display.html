<script type="text/html" data-help-name="ccu-display">
    <p>Send texts to displays.</p>
    <p>If <code>msg.lineX</code>, <code>msg.iconX</code> or <code>msg.colorX</code>
    are set in the message these are used instead of the configuration.</p>
    <p> With <code>msg.disbleX</code> you can explicitly set that no data is transferred for the line.</p>

    <h3>HmIP-WRCD</h3>
    <p>The wall-mount remote with e-paper display has five lines of 16 characters, per line an icon, the alignment, text colour and background (black or white), and a sound with repetitions and interval. The node writes all of it in one command to <code>COMBINED_PARAMETER</code> of channel 3. A line set to "Don't touch" stays as it is.</p>
    <p>From the message: <code>msg.lineX</code> (text), <code>msg.iconX</code> (number 0 to 31 or a name from <code>DISPLAY_DATA_ICON</code>, e.g. <code>LAMP_ON</code>), <code>msg.colorX</code> and <code>msg.backgroundX</code> (<code>BLACK</code> or <code>WHITE</code>), <code>msg.alignX</code> (<code>LEFT</code>, <code>CENTER</code>, <code>RIGHT</code>), <code>msg.disableX</code>.</p>
    <p>Umlauts and ß are translated for the display. Comma, equals sign and braces are part of the command itself and are sent as full stop, colon and parentheses; characters the display does not know are left out. The HmIP-WRCD has not yet been tried on a device.</p>

    <h3>Dynamic configuration</h3>
    <p><code>msg.config</code> is an object whose properties override this node's configuration for that one message. The stored configuration is never modified.</p>
    <ul>
        <li><code>iface</code></li>
        <li><code>channel</code></li>
        <li><code>channelType</code></li>
        <li><code>sound</code></li>
        <li><code>repeat</code></li>
        <li><code>pause</code></li>
        <li><code>signal</code></li>
        <li><code>line1 ... line6</code></li>
        <li><code>color1 ... color6</code></li>
        <li><code>icon1 ... icon6</code></li>
        <li><code>disable1 ... disable6</code></li>
        <li>HmIP-WRCD: <code>wrcdIcon1 ... wrcdIcon5</code>, <code>wrcdAlign1 ... wrcdAlign5</code>, <code>wrcdColor1 ... wrcdColor5</code>, <code>wrcdBackground1 ... wrcdBackground5</code>, <code>wrcdSound</code> (number 0 to 7 or a name from <code>ACOUSTIC_NOTIFICATION_SELECTION</code>), <code>wrcdRepeat</code> (0 to 15), <code>wrcdInterval</code> (5 to 80 seconds)</li>
    </ul>
    <p><code>msg.line1</code> and friends keep working unchanged.</p>
</script>
