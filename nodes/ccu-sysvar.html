<script type="text/javascript">
    RED.nodes.registerType('ccu-sysvar', {

        category: 'ccu',
        defaults: {
            name: {value: ''},
            ccuConfig: {value: 'localhost', type: 'ccu-connection', required: true},
            topic: {value: 'ReGaHSS/${Name}'},  
            change: {value: true},
            cache: {value: true},
            property: {value: 'payload'},
            propertyType: {value: 'msg'}
        },
        inputs: 1,
        outputs: 1,
        icon: 'ccu.png',
        color: '#8BB9D2',
        paletteLabel: 'sysvar',
        align: 'right',
        label() {
            return this.name || 'sysvar';
        },
        labelStyle() {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare() {
            const cname = this.name;

            // Where the value to write comes from (#56). Older nodes have no
            // property/propertyType - default them to msg.payload, which is
            // what the node always used.
            if (!this.property) {
                this.property = 'payload';
                $('#node-input-property').val('payload');
            }

            if (!this.propertyType) {
                this.propertyType = 'msg';
            }

            $('#node-input-property').typedInput({
                default: this.propertyType,
                types: ['msg', 'flow', 'global', 'str', 'num', 'bool', 'json', 'env'],
                typeField: $('#node-input-propertyType')
            });

            // Migration
            if (typeof this.change === 'undefined') {
                $('#node-input-change').attr('checked', true);
            }

            if (typeof this.cache === 'undefined') {
                $('#node-input-cache').attr('checked', true);
            }

            function getConf(nodeId) {
                $('#select-input-name').html('').hide();
                $('#node-input-name').val('').show();

                if (nodeId && nodeId !== '_ADD_') {
                    $.getJSON('ccu?type=sysvar&config=' + nodeId, data => {
                        $('#select-input-name').html('<option value=""></option>');
                        if (data) {
                            Object.keys(data).forEach(name => {
                                $('#select-input-name').append('<option value="' + name + '"' + (name === cname ? ' selected' : '') + '>' + name + '</option>');
                            });
                            $('#node-input-name').hide();
                            $('#select-input-name').show();
                        } else {
                            $('#select-input-name').hide();
                            $('#node-input-name').show();
                        }
                    });
                }
            }

            getConf(this.ccuConfig);

            $('#node-input-ccuConfig').change(() => {
                getConf($('#node-input-ccuConfig').val());
            });
        },
        oneditsave() {
            if ($('#select-input-name').is(':visible')) {
                $('#node-input-name').val($('#select-input-name').val());
            }
        }
    });

</script>

<script type="text/x-red" data-help-name="ccu-sysvar" lang="de-DE">
    <p>Setzen und lesen von ReGaHSS Systemvariablen.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload
            <span class="property-type">*</span>
        </dt>
        <dd>
            Der Wert der der Systemvariablen zugewiesen werden soll.
        </dd>
    </dl>
    <h3>Outputs</h3>
     <ol class="node-ports">
         <li>Output

               <code>msg</code> Beispiel:<br>
               <pre><code>
{
	"ccu": "localhost",
	"iface": "ReGaHSS",
	"type": "SYSVAR",
	"name": "Anwesenheit",
	"payload": false,
	"value": false,
	"valueType": "boolean",
	"valueEnum": "nicht anwesend",
	"ts": 1525197999611,
	"lc": 1525197999611,
	"enum": ["nicht anwesend", "anwesend"],
	"id": 950,
	"topic": "ReGaHSS/Anwesenheit"
}
               </code></pre>
         </li>
     </ol>

    <h3>Dynamische Konfiguration</h3>
    <p><code>msg.config</code> ist ein Objekt, dessen Eigenschaften die Konfiguration dieses Nodes für genau diese Nachricht überschreiben. Die gespeicherte Konfiguration bleibt unverändert.</p>
    <ul>
        <li><code>name</code></li>
    </ul>
    <p>Woher der zu schreibende Wert kommt, stellt das Feld <em>Wert aus</em> ein (msg/flow/global/env) — er muss nicht mehr in <code>msg.payload</code> stehen.</p>
</script>

<script type="text/x-red" data-help-name="ccu-sysvar" lang="en-US">
    <p>Set and read ReGaHSS system variables.</p>
        <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload
            <span class="property-type">*</span>
        </dt>
        <dd>
            The value that should be assigned to the variable.
        </dd>
    </dl>

    <h3>Dynamic configuration</h3>
    <p><code>msg.config</code> is an object whose properties override this node's configuration for that one message. The stored configuration is never modified.</p>
    <ul>
        <li><code>name</code></li>
    </ul>
    <p>The <em>Value from</em> field selects where the value to write comes from (msg/flow/global/env); it no longer has to be <code>msg.payload</code>.</p>
</script>
