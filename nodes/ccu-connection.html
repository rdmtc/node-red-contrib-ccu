<script type="text/javascript">
    RED.nodes.registerType('ccu-connection', {
        category: 'config',
        defaults: {
            name: {value: ''},
            host: {value: '', required: true},

            regaEnabled: {value: true},
            bcrfEnabled: {value: true},
            iprfEnabled: {value: true},
            virtEnabled: {value: true},
            bcwiEnabled: {value: false},
            cuxdEnabled: {value: false},
            jackEnabled: {value: false},
            jackPort: {value: 2121},

            regaPoll: {value: true},
            regaInterval: {value: 30},
            regaMetaInterval: {value: 15},

            rpcPing: {value: true},
            rpcPingTimeout: {value: 60},
            rpcInitAddress: {value: ''},
            rpcServerHost: {value: '', required: true},
            rpcBinPort: {value: '', required: true},
            rpcXmlPort: {value: '', required: true},
            
            tls: {value: false},
            inSecure: {value: false},
            authentication: {value: false},            
            username: {value: ''},

            metaPort: {value: ''},

            queueTimeout: {value: 5000, required: true},
            queuePause: {value: 250, required: true},

            contextStore: {value: ''}
        },
        // B-31: the CCU password and the openccu-lite token live in Node-RED's
        // credentials (flows_cred.json, encrypted, never exported), not in the flow
        credentials: {
            password: {type: 'password'},
            metaToken: {type: 'password'}
        },
        label() {
            return this.name || this.host;
        },

        oneditprepare() {
            // pre-4.3.0 config nodes have neither property - show the defaults
            // the runtime uses rather than an unchecked box / empty field
            if (typeof this.rpcPing === 'undefined') {
                this.rpcPing = true;
                $('#node-config-input-rpcPing').prop('checked', true);
            }

            if (typeof this.regaMetaInterval === 'undefined') {
                this.regaMetaInterval = 15;
                $('#node-config-input-regaMetaInterval').val(15);
            }

            const $nodeConfigInputHost = $('#node-config-input-host');
            const $nodeConfigInputName = $('#node-config-input-name');
            const $nodeConfigInputRpcServerHost = $('#node-config-input-rpcServerHost');
            const $nodeInputContextStore = $('#node-config-input-contextStore');

            if (typeof this.queueTimeout === 'undefined') {
                $('#node-config-input-queueTimeout').val(5000);
            }

            if (typeof this.queuePause === 'undefined') {
                $('#node-config-input-queuePause').val(250);
            }

            RED.settings.context.stores.forEach(store => {
                $nodeInputContextStore.append('<option value="' + store + '"' + (this.contextStore === store ? ' selected' : '') + '>' + store + '</option>');
            });

            $nodeConfigInputHost.on('focus', () => $nodeConfigInputHost.autocomplete('search', ''));

            $.getJSON('ccu', data => {
                const discovered = [];
                data.discover.forEach(ccu => {
                    discovered.push(ccu.address + ' ' + ccu.serial);
                });

                $nodeConfigInputHost.autocomplete({
                    source: discovered,
                    select: (_, ui) => {
                        const name = ui.item.label;
                        const address = name.split(' ').shift();
                        const serial = name.split(' ').pop();

                        $nodeConfigInputHost.val(address);
                        $nodeConfigInputName.val(serial);

                        data.discover.forEach(ccu => {
                            if (ccu.address === address) {
                                $('#node-config-input-regaEnabled').prop('checked', ccu.interfaces.ReGaHSS);
                                $('#node-config-input-bcrfEnabled').prop('checked', ccu.interfaces['BidCos-RF']);
                                $('#node-config-input-iprfEnabled').prop('checked', ccu.interfaces['HmIP-RF']);
                                $('#node-config-input-virtEnabled').prop('checked', ccu.interfaces.VirtualDevices);
                                $('#node-config-input-bcwiEnabled').prop('checked', ccu.interfaces['BidCos-Wired']);
                                $('#node-config-input-cuxdEnabled').prop('checked', ccu.interfaces.CuXD);
                                $('#node-config-input-jackEnabled').prop('checked', ccu.interfaces['CCU-Jack']);
                            }
                        });
                    },
                    delay: 0,
                    minLength: 0
                });

                $nodeConfigInputHost.on('change', () => {
                    if (!$nodeConfigInputHost.val().endsWith($nodeConfigInputName.val())) {
                        $nodeConfigInputName.val($nodeConfigInputHost.val());
                    }
                });

                data.listen.forEach(addr => {
                    $nodeConfigInputRpcServerHost.append('<option>' + addr + '</option>');
                });

                $nodeConfigInputRpcServerHost.val(this.rpcServerHost || data.listen[1]);

                if (!this.rpcBinPort) {
                    $('#node-config-input-rpcBinPort').val(data.ports[0]);
                }

                if (!this.rpcXmlPort) {
                    $('#node-config-input-rpcXmlPort').val(data.ports[1]);
                }
            });

            setTimeout(() => {
                if (!this.host) {
                    $nodeConfigInputHost.focus();
                }
            }, 250);

            // task 5 (#27): credentials without TLS travel in plain text - turning
            // authentication on turns TLS on too (it can be unticked again)
            const $auth = $('#node-config-input-authentication');
            const $tls = $('#node-config-input-tls');
            $auth.on('change', () => {
                if ($auth.is(':checked') && !$tls.is(':checked')) {
                    $tls.prop('checked', true);
                    RED.notify('TLS/SSL switched on: without it the credentials would be sent in plain text.', {type: 'warning', timeout: 6000});
                }
            });

            // a loopback address is Node-RED on the system: the interface processes are
            // reached directly, TLS and credentials are not used (lib/localccu.js)
            const isLoopback = host => /^(127\.|localhost$|::1$)/.test(String(host || '').trim());
            const showAuthRows = () => {
                const local = isLoopback($nodeConfigInputHost.val());
                $('#node-config-auth-fields, #node-config-auth-hint').toggle(!local);
                $('#node-config-input-username, #node-config-input-password').closest('.form-row').toggle(!local);
                $('#node-config-auth-local').toggle(local);
            };
            $nodeConfigInputHost.on('change keyup', showAuthRows);
            showAuthRows();

            // task 9: re-read the device table of the deployed connection
            const $reread = $('#node-config-reread');
            const $rereadStatus = $('#node-config-reread-status');
            $reread.on('click', () => {
                $reread.prop('disabled', true);
                $rereadStatus.text('Re-reading ...');
                $.ajax({url: 'ccu/' + this.id + '/reread', type: 'POST', dataType: 'json'})
                    .done(summary => {
                        const parts = Object.keys(summary).map(iface => {
                            const s = summary[iface];
                            return iface + ': ' + (s.error ? s.error : s.total + ' entries (' + s.added + ' new, ' + s.changed + ' changed, ' + s.removed + ' removed)');
                        });
                        $rereadStatus.text(parts.length > 0 ? parts.join('; ') : 'no interface connected');
                    })
                    .fail(xhr => {
                        $rereadStatus.text(xhr.status === 404 ? 'Deploy this connection first.' : 'Failed: ' + (xhr.responseJSON && xhr.responseJSON.error || xhr.statusText));
                    })
                    .always(() => $reread.prop('disabled', false));
            });
        }
    });

</script>

<script type="text/x-red" data-template-name="ccu-connection">
    <style>
        label.ccu-checkbox {
            display: block !important;
            width: auto !important;
        }
        label.ccu-checkbox input {
            width: auto !important;
            margin-top: -3px !important;
        }
    </style>
    <div class="form-row">
        <label for="node-config-input-name"><i class="icon-tag"></i> CCU name</label>
        <input type="text" id="node-config-input-name">
    </div>
    <div class="form-row">
        <label for="node-config-input-host"><i class="icon-tag"></i> CCU address</label>
        <input type="text" id="node-config-input-host">
    </div>
    <div class="form-row">
        <label for="node-config-input-rpcServerHost"><i class="icon-tag"></i> Listen address</label>
        <select id="node-config-input-rpcServerHost"></select>
    </div>
    <div class="form-row">
        <label for="node-config-input-rpcInitAddress"><i class="icon-tag"></i> Init address</label>
        <input type="text" id="node-config-input-rpcInitAddress">
    </div>
    <div class="form-row">
        <label for="node-config-input-rpcBinPort"><i class="icon-tag"></i> BINRPC listening port</label>
        <input type="text" id="node-config-input-rpcBinPort">
    </div>
    <div class="form-row">
        <label for="node-config-input-rpcXmlPort"><i class="icon-tag"></i> XMLRPC listening port</label>
        <input type="text" id="node-config-input-rpcXmlPort">
    </div>
    <div class="form-row">
        <label for="node-input-rfdEnabled"><i class="icon-tag"></i> Interfaces</label>
        <div style="width: 70%; display: inline-block; vertical-align: text-top;">
            <label class="ccu-checkbox"><input type="checkbox" id="node-config-input-regaEnabled"> ReGaHSS</label><br>
            <label class="ccu-checkbox"><input type="checkbox" id="node-config-input-bcrfEnabled"> BidCos-RF</label><br>
            <label class="ccu-checkbox"><input type="checkbox" id="node-config-input-bcwiEnabled"> BidCos-Wired</label><br>
            <label class="ccu-checkbox"><input type="checkbox" id="node-config-input-iprfEnabled"> HmIP-RF</label><br>
            <label class="ccu-checkbox"><input type="checkbox" id="node-config-input-virtEnabled"> VirtualDevices</label><br>
            <label class="ccu-checkbox"><input type="checkbox" id="node-config-input-cuxdEnabled"> CUxD</label><br>
            <label class="ccu-checkbox"><input type="checkbox" id="node-config-input-jackEnabled"> CCU-Jack</label>
            <input type="text" id="node-config-input-jackPort" style="width: 70px;" placeholder="2121">
        </div>
    </div>
    <div class="form-row">
        <label for="node-config-input-rpcPing"><i class="icon-tag"></i> RPC ping</label>
        <div style="width: 70%; display: inline-block; vertical-align: text-top;">
            <label class="ccu-checkbox"><input type="checkbox" id="node-config-input-rpcPing"> Enabled</label><br>
            <small>Off disables the periodic ping and the timeout-triggered re-init for this connection.</small>
        </div>
    </div>
    <div class="form-row">
        <label for="node-config-input-rpcPingTimeout"><i class="icon-tag"></i> RPC ping timeout (s)</label>
        <input type="text" id="node-config-input-rpcPingTimeout">
    </div>
    <div class="form-row">
        <label for="node-config-reread"><i class="icon-tag"></i> Device data</label>
        <div style="width: 70%; display: inline-block; vertical-align: text-top;">
            <button type="button" class="red-ui-button" id="node-config-reread">Re-read device data</button><br>
            <small id="node-config-reread-status">Asks every connected interface for its device list again; new and changed devices get their datapoints fetched, removed ones go.</small>
        </div>
    </div>
    <div class="form-row">
        <label for="node-config-input-regaPoll"><i class="icon-tag"></i> Rega poll</label>
        <div style="width: 70%; display: inline-block; vertical-align: text-top;">
            <label class="ccu-checkbox"><input type="checkbox" id="node-config-input-regaPoll"> Enabled</label><br>
        </div>
    </div>
    <div class="form-row">
        <label for="node-config-input-regaInterval"><i class="icon-tag"></i> Rega poll interval (s)</label>
        <input type="text" id="node-config-input-regaInterval">
    </div>
    <div class="form-row">
        <label for="node-config-input-regaMetaInterval"><i class="icon-tag"></i> Names/rooms refresh (min)</label>
        <input type="text" id="node-config-input-regaMetaInterval">
        <small>How often channel names, rooms and functions are re-read. 0 = never (the behaviour before 4.3.0).</small>
    </div>
    <div class="form-row">
        <label for="node-config-input-queueTimeout"><i class="icon-tag"></i> Queue timeout (ms)</label>
        <input type="text" id="node-config-input-queueTimeout">
    </div>
    <div class="form-row">
        <label for="node-config-input-queuePause"><i class="icon-tag"></i> Queue Pause (ms)</label>
        <input type="text" id="node-config-input-queuePause">
    </div>
    <div class="form-row">
        <label for="node-input-contextStore"><i class="icon-tag"></i> Context Store</label>
        <select id="node-config-input-contextStore">
            <option value="">none</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-authentication"><i class="icon-tag"></i> Authentication</label>
        <div style="width: 70%; display: inline-block; vertical-align: text-top;">
            <span id="node-config-auth-fields">
                <label class="ccu-checkbox"><input type="checkbox" id="node-config-input-authentication"> Enabled</label><br>
                <label class="ccu-checkbox"><input type="checkbox" id="node-config-input-tls"> TLS/SSL</label><br>
                <label class="ccu-checkbox"><input type="checkbox" id="node-config-input-inSecure"> Ignore invalid TLS Certificates</label><br>
            </span>
            <small id="node-config-auth-hint">For a CCU on the network: TLS uses the CCU's 4xxxx ports, the credentials are sent as HTTP basic auth (switch both on in the CCU's firewall settings, on openccu-lite under remote access). Node-RED's own callback server for the CCU's events stays plain HTTP.</small>
            <small id="node-config-auth-local" style="display: none;">Node-RED runs on the system itself: the interface processes are reached directly on the loopback (BIN-RPC for BidCos), without TLS and without credentials. These settings are not used.</small>
        </div>
    </div>
    <div class="form-row">
        <label for="node-config-input-username"><i class="icon-tag"></i> Username</label>
        <input type="text" id="node-config-input-username">
    </div>    
    <div class="form-row">
        <label for="node-config-input-password"><i class="icon-tag"></i> Password</label>
        <input type="password" id="node-config-input-password">
    </div>
    <div class="form-row">
        <label for="node-config-input-metaToken"><i class="icon-tag"></i> openccu-lite token</label>
        <input type="password" id="node-config-input-metaToken" placeholder="olt_...">
        <small>Only for openccu-lite (a CCU ignores this). Leave empty when Node-RED runs on the box.</small>
    </div>
    <div class="form-row">
        <label for="node-config-input-metaPort"><i class="icon-tag"></i> openccu-lite port</label>
        <input type="text" id="node-config-input-metaPort" placeholder="80 / 443">
        <small>Only needed when the box's web server is not on the default port.</small>
    </div>
</script>
