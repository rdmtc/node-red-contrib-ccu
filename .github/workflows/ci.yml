name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        node-red: [4, 5]
        exclude:
          # Node-RED 5 requires Node >= 22.9
          - node: 20
            node-red: 5
    name: test (node ${{ matrix.node }}, node-red ${{ matrix.node-red }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.node-red == 5
        run: npm install --no-save node-red@^5
      - run: npm run test:unit
